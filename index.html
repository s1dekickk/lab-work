<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
    <style>
        body {
            background-color: lightgreen; 
        }
    </style>
</head>
<body>
    <header>
    <h2 style="color: #03fcc2;">Survey</h2>
    <p class="description">
        If you have a moment, we'd appreciate it if you would fill out this survey.
    </p>
    </header>
    <form action="/submit-data" method="POST">
    <h3 style="color: #03fcc2;">Your information:</h3> 
    <div class="mb-3">
        <label for="fname" class="form-label">First Name</label>
        <input type="text" class="form-control" id="fname" name="fname" required>
    </div>
    <div class="mb-3">
        <label for="lname" class="form-label">Last Name</label>
        <input type="text" class="form-control" id="lname" name="lname" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <div class="mb-3">
        <label for="bdate" class="form-label">Date of Birth</label>
        <input type="text" class="form-control" id="bdate" name="fname" required>
    </div>

    <div class="form-grid">
        <label for="bdate">Date of Birth</label>
        <input type="date" id="bdate" name="bdate">
    </div>
    <fieldset class="mb-3">
    <legend class="col-form-label pt-0">How did you hear about us?</legend>

    <div class="form-check">
        <input class="form-check-input" type="radio" id="social" name="source" value="search_engine">
        <label class="form-check-label" for="search">Search engine</label>
    </div>
    
    <div class="form-check">
        <input class="form-check-input" type="radio" id="mouth" name="source" value="word_of_mouth">
        <label class="form-check-label" for="mouth">Word of mouth</label>
    </div> 

    <div class="form-check">
        <input class="form-check-input" type="radio" id="social" name="source" value="social_media">
        <label class="form-check-label" for="media">Social media</label>
    </div>
    
    <div class="form-check">
        <input class="form-check-input" type="radio" id="other" name="source" value="other">
        <label class="form-check-label" for="other">Other</label>
    </div>

    </fieldset>
    <h2 style="color: #03fcc2;">Would you like to receive announcements about new CDs and special offers?</h2>
    <div>
        <input type="checkbox" id="option1" name="preference" value="traditionalAnnouncement">
        <label for="option1">YES, I'd like to</label>
    </div>
    <div>
        <input type="checkbox" id="option2" name="preference" value="emailAnnoucement">
        <label for="option2">YES, please send me email announcements</label>
    </div>
    <br>
    <div class="mb-3">
        <label for="contact" class="form-label">Please contact me by</label>
        <select class="form-select" name="contact" id="contact">
            <option value="email&Poster">Email or poster mail</option>
            <option value="email">Email only</option>
            <option value="Poster">Poster mail only</option>
        </select>
    </div>
    <br>
    <div>
        <input type="submit">
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous">
    </script>
</form>
</body>
</html>
