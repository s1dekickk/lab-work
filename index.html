<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
    <h2 style="color: cyan;">Survey</h2>
    <p class="description">
        If you have a moment, we'd appreciate it if you would fill out this survey.
    </p>
    <style>
        body {
            background-color: lightgreen; 
        }
    </style>
</header>
    <form action="/submit-data" method="POST">
    <h3 style="color: cyan;">Your information:</h3> 
    <div class="form-grid">
        <label for="fname">First Name</label>
        <input type="text" id="fname" name="fname" required>
    </div>
    <div class="form-grid">
        <label for="lname">Last Name</label>
        <input type="text" id="lname" name="lname" required>
    </div>
    <div class="form-grid">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-grid">
        <label for="bdate">Date of Birth</label>
        <input type="date" id="bdate" name="bdate">
    </div>
    <h3>How did you hear about us?</h3>
    <div class="form-grid">
        <label>Search engine</label>
        <input type="radio", name="method">
        <label>Word of mouth</label>
        <input type="radio", name="method">
        <label>Social media</label>
        <input type="radio", name="method">
        <label>Other</label>
        <input type="radio", name="method">
    </div>
    <h2 style="color: cyan;">Would you like to receive announcements about new CDs and special offers?</h2>
    <div>
        <input type="checkbox" id="option1" name="preference" value="traditionalAnnouncement">
        <label for="option1">YES, I'd like to</label>
    </div>
    <div>
        <input type="checkbox" id="option2" name="preference" value="emailAnnoucement">
        <label for="option2">YES, please send me email announcements</label>
    </div>
    <br>
    <div>
        <label for="contact">Please contact me by</label>
        <select name="contact" id="contact">
            <option>Email or poster mail</option>
            <option>Email only</option>
            <option>Poster mail only</option>
        </select>
    </div>
    <br>
    <div>
        <input type="submit">
    </div>
</form>
</body>
</html>
